<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACC Community Leaderboard Manager</title>
    <!-- Include Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    	:root {
            --bg-body: #05070b;
            --bg-card: #0d1117;
            --bg-card-hover: #161b22;
            --border-subtle: rgba(56, 189, 248, 0.12);
            --accent-primary: #38bdf8; /* Electric Cyan */
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-light: #cbd5e1;
		}
		 hr.rgbhr{
		    width:100%;
		    height:1px;
		    border:none;
		    background:linear-gradient(to right, #16181f 0%, var(--accent-primary) 50%, #16181f 100%);
		    }
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0px auto;
            padding: 10px;
            background-color: #12161f;
            color: #e1e1e6;
        }
        .header {
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		}
		
		.logo-link {
            display: block;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            text-decoration: none;
            text-align: center;
		}
		
		.logo-text {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1;
            border: 1px solid #183542;
            border-radius: 8px;
            padding: 18px 0px 16px 0px;
            margin: 0px 0px 20px 0px;
		}

		.logo-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2.5px;
            padding-bottom: 5px;
            background: linear-gradient(135deg, #ffffff 0%, #9fb6c9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
		}

		.logo-subtitle {
		    margin-top: 10px;
		    font-size: 16px;
		    font-weight: 700;
		    letter-spacing: 6px;
		    color: #49bff5;
		}
		.subtitle {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
		}

        h2, h3, h4 {
            color: #f8f9fa;
            border-bottom: 2px solid #2b6cb0;
            padding-bottom: 5px;
            margin-top: 0px;
        }
        h2 {
            text-align: center;
            border-bottom: none;
            color: #63b3ed;
            margin-bottom: 25px;
        }
        
        /* Navigation Header Styles */
        .nav-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            background: #1a202c;
            padding: 15px;
            border: 1px solid #2d3748;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .nav-btn {
            background-color: #2d3748;
            color: #cbd5e0;
            border: 1px solid #4a5568;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: #4a5568;
            color: #fff;
        }
        .nav-btn.active {
            background-color: #3182ce;
            color: white;
            border-color: #3182ce;
        }
        .nav-btn2 {
            background-color: #2d3748;
            color: #cbd5e0;
            border: 1px solid #4a5568;
            padding: 4px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            transition: all 0.2s;
        }

        .section-box {
            background: #1a202c;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #2d3748;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .edit-box {
            background: #202634;
            border: 1px dashed #d69e2e;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            margin-bottom: 15px;
            display: none;
        }
        .edit-box h4 {
            margin-top: 0;
            color: #d69e2e;
            border-bottom: 1px solid #4a5568;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e0;
            font-size: 15px;
        }
        select, input[type="email"], input[type="password"], input[type="number"], input[type="datetime-local"] {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #4a5568;
            border-radius: 4px;
            background-color: #2d3748;
            color: #fff;
        }
        select:focus, input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus, input[type="datetime-local"]:focus {
            border-color: #63b3ed;
            outline: none;
        }

        /* Custom Styled File Picker */
        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 4px;
            padding: 6px 10px;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .custom-file-btn {
            background-color: #4a5568;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
            border: none;
        }
        .custom-file-btn:hover {
            background-color: #718096;
        }
        #fileNameDisplay {
            font-size: 13px;
            color: #a0aec0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            padding: 9px 15px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        button.btn-danger {
            background-color: #e53e3e;
        }
        button.btn-danger:hover {
            background-color: #c53030;
        }
        button.btn-warning {
            background-color: #d69e2e;
            color: #1a202c;
        }
        button.btn-warning:hover {
            background-color: #b7791f;
        }
        button.btn-secondary {
            background-color: #4a5568;
        }
        button.btn-secondary:hover {
            background-color: #718096;
        }
        button.btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #2d3748;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #4a5568;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            color: #e2e8f0;
        }
        th {
            background-color: #202634;
            color: #63b3ed;
        }
        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .hidden {
            display: none !important;
        }
        
        /* Pagination Controls */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            background: #202634;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #4a5568;
        }
        .pagination-bar span {
            font-size: 13px;
            color: var(--text-light);
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border-subtle);
            margin-top: 10px;
            padding-bottom: 11px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .footer-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }
        .footer-copy {
            color: #475569;
        }

        /* LOGIN MODAL OVERLAY */
        .loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 7, 11, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #1a202c;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box h3 {
            color: #63b3ed;
            border-bottom: 2px solid #2b6cb0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
      	/* Compact Admin Checkbox */
				.checkbox-inline {
				    display: flex;
				    align-items: center;
				    gap: 10px;
				    margin-bottom: 12px;
				}

				.checkbox-inline label {
				    display: inline-block;
				    margin: 0;
				    color: #cbd5e0;
				    font-size: 14px;
				    cursor: pointer;
				}

				.checkbox-inline input[type="checkbox"] {
				    appearance: none;
				    -webkit-appearance: none;
				    width: 16px;
				    height: 16px;
				    min-width: 16px;
				    margin: 0;
				    padding: 0;
				    border: 1px solid #4a5568;
				    border-radius: 3px;
				    background: #2d3748;
				    cursor: pointer;
				    display: inline-grid;
				    place-content: center;
				    transition: background 0.15s, border-color 0.15s;
				}

				.checkbox-inline input[type="checkbox"]:hover {
				    border-color: #63b3ed;
				}

				.checkbox-inline input[type="checkbox"]:checked {
				    background: #3182ce;
				    border-color: #63b3ed;
				}

				.checkbox-inline input[type="checkbox"]::before {
				    content: "";
				    width: 4px;
				    height: 8px;
				    border: solid #ffffff;
				    border-width: 0 2px 2px 0;
				    transform: rotate(45deg) scale(0);
				    margin-top: -2px;
				}

				.checkbox-inline input[type="checkbox"]:checked::before {
				    transform: rotate(45deg) scale(1);
				}

				.checkbox-inline input[type="checkbox"]:focus-visible {
				    outline: 2px solid #63b3ed;
				    outline-offset: 2px;
				}

        /* --- ACC LOGIN EXPERIENCE --- */
        .loginOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 28px 18px;
            box-sizing: border-box;
            background:
                radial-gradient(ellipse at 50% 34%, rgba(0, 163, 224, .13) 0%, transparent 42%),
                radial-gradient(ellipse at 15% 85%, rgba(255, 0, 127, .07) 0%, transparent 35%),
                #05080e;
            isolation: isolate;
        }
        .loginOverlay::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: .17;
            background-image:
                linear-gradient(rgba(110, 160, 190, .12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(110, 160, 190, .12) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
        }
        .loginOverlay::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: min(720px, 90vw);
            height: 1px;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, .55), transparent);
            box-shadow: 0 0 24px rgba(0, 245, 255, .35);
        }
        .login-box {
            position: relative;
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            padding: 34px 38px 25px;
            overflow: hidden;
            text-align: left;
            border: 1px solid rgba(0, 210, 245, .24);
            border-radius: 18px;
            background: linear-gradient(155deg, rgba(18, 27, 40, .97), rgba(8, 13, 22, .98) 68%);
            box-shadow:
                0 28px 90px rgba(0, 0, 0, .62),
                0 0 45px rgba(0, 163, 224, .09),
                inset 0 1px 0 rgba(255, 255, 255, .055);
            animation: loginRise .55s cubic-bezier(.2, .75, .25, 1) both;
        }
        .login-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f5ff 28%, #ff007f 72%, transparent);
            box-shadow: 0 0 18px rgba(0, 245, 255, .55);
        }
        .login-brand { text-align: center; }
        .login-logo {
            width: 112px;
            height: 112px;
            margin: 0 auto 7px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 190, 230, .13), rgba(0, 190, 230, 0) 68%);
        }
        .login-logo svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 0 12px rgba(0, 220, 255, .18));
        }
        .login-eyebrow {
            margin-top: 2px;
            color: #00dff5;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 4px;
        }
        .login-brand h1 {
            margin: 9px 0 0;
            padding: 0;
            border: 0;
            color: #f4f8fc;
            font-size: clamp(22px, 5vw, 27px);
            line-height: 1.15;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .login-brand h1 span {
            color: #a8bacb;
            font-weight: 600;
        }
        .login-tagline {
            margin: 10px 0 0;
            color: #8294a8;
            font-size: 12px;
            letter-spacing: .35px;
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 27px 0 23px;
            color: #5f7489;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2.6px;
            white-space: nowrap;
        }
        .login-divider::before, .login-divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, rgba(105, 150, 180, .28));
        }
        .login-divider::after {
            transform: scaleX(-1);
        }
        .login-box .form-group { margin-bottom: 18px; }
        .login-box label {
            margin-bottom: 8px;
            color: #c5d3df;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .35px;
        }
        .login-box input[type="email"],
        .login-box input[type="password"] {
            width: 100%;
            min-height: 48px;
            box-sizing: border-box;
            padding: 0 14px;
            border: 1px solid #293b4d;
            border-radius: 8px;
            outline: none;
            background: rgba(4, 10, 18, .8);
            color: #f3f8fc;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .login-box input::placeholder { color: #56697c; }
        .login-box input:hover { border-color: #3a5a70; }
        .login-box input:focus {
            border-color: #00cce8;
            background: rgba(4, 14, 23, .98);
            box-shadow: 0 0 0 3px rgba(0, 204, 232, .12), 0 0 18px rgba(0, 204, 232, .08);
        }
        .login-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            min-height: 49px;
            margin-top: 7px;
            padding: 0 18px;
            border: 1px solid rgba(0, 245, 255, .55);
            border-radius: 8px;
            background: linear-gradient(100deg, #00a9ce, #087db8 58%, #075e91);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .5px;
            box-shadow: 0 8px 24px rgba(0, 155, 205, .2), inset 0 1px 0 rgba(255, 255, 255, .18);
            transition: transform .18s, filter .18s, box-shadow .18s;
        }
        .login-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.13);
            background: linear-gradient(100deg, #00b9df, #098bc8 58%, #0870a8);
            box-shadow: 0 11px 28px rgba(0, 180, 220, .28);
        }
        .login-submit:active { transform: translateY(0); }
        .login-submit-arrow { font-size: 20px; line-height: 1; }
        .login-box .status-msg { min-height: 0; margin-top: 10px; }
        .login-error {
            min-height: 0;
            margin: 8px 0 0;
            color: #ff718c;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
        .login-footnote {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 17px;
            border-top: 1px solid rgba(110, 150, 180, .13);
            color: #64798c;
            font-size: 10px;
            letter-spacing: .45px;
        }
        .login-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22d3a6;
            box-shadow: 0 0 9px rgba(34, 211, 166, .65);
        }
        @keyframes loginRise {
            from { opacity: 0; transform: translateY(14px) scale(.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @media (max-width: 480px) {
            .loginOverlay { padding: 18px 12px; }
            .login-box { padding: 27px 23px 22px; border-radius: 14px; }
            .login-logo { width: 98px; height: 98px; }
            .login-divider { margin: 23px 0 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-box { animation: none; }
            .login-submit, .login-box input { transition: none; }
        }

    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div class="loginOverlay" id="auth-forms">
        <div class="login-box">
            <div class="login-brand">
                <div class="login-logo" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ACC Community Leaderboard logo">
                        <defs>
                            <linearGradient id="cyanGradHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#00f5ff" />
                                <stop offset="100%" stop-color="#00a3e0" />
                            </linearGradient>
                            <linearGradient id="magentaGradHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#ff007f" />
                                <stop offset="100%" stop-color="#b30059" />
                            </linearGradient>
                            <linearGradient id="yellowGradHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#ffe600" />
                                <stop offset="100%" stop-color="#ff9900" />
                            </linearGradient>
                            <filter id="neonGlowHoriz" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="5" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                        </defs>
                        <g transform="translate(-47, 3)">
                            <g transform="translate(36, 11)">
                                <g filter="url(#neonGlowHoriz)">
                                    <polygon points="50,145 75,145 105,55 80,55" fill="url(#cyanGradHoriz)" />
                                    <polygon points="90,145 115,145 152,30 127,30" fill="url(#cyanGradHoriz)" />
                                    <polygon points="130,145 155,145 185,55 160,55" fill="url(#cyanGradHoriz)" />
                                    <polygon points="30,105 180,105 200,85 50,85" fill="url(#magentaGradHoriz)" />
                                    <polygon points="20,128 160,128 178,110 38,110" fill="url(#yellowGradHoriz)" />
                                </g>
                                <circle cx="92.5" cy="42" r="4" fill="#00f5ff" />
                                <circle cx="139.5" cy="18" r="4" fill="#00f5ff" />
                                <circle cx="172.5" cy="42" r="4" fill="#00f5ff" />
                            </g>
                        </g>
                    </svg>
                </div>
                <div class="login-eyebrow">ACC COMMUNITY</div>
                <h1>LEADERBOARD <span>MANAGER</span></h1>
                <p class="login-tagline">Race Data. Real Competition. One Community.</p>
            </div>

            <div class="login-divider"><span>ADMIN ACCESS</span></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email address</label>
                    <input type="email" id="login-email" placeholder="you@example.com"
                           autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-submit">
                    <span>Log In</span>
                    <span class="login-submit-arrow" aria-hidden="true">→</span>
                </button>
                <div id="loginStatus" class="status-msg" aria-live="polite"></div>
            </form>
            <p id="error-msg" class="login-error" role="alert"></p>
            <div class="login-footnote"><span class="login-status-dot"></span> Secure administrator sign-in</div>
        </div>
    </div>
    


    <script>
        const SUPABASE_URL = '__SUPABASE_URL_PLACEHOLDER__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY_PLACEHOLDER__';
				const supabase2 = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        
        
        // Check if user is already logged in, redirect to dashboard if so
        async function checkSession() {
            const { data: { session } } = await supabase2.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
            }
        }
        checkSession();
        
        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase2.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('error-msg').innerText = error.message;
            } else {
                window.location.href = 'admin.html';
            }
        });

    </script>
</body>
</html>
