  <script type="text/babel">
  	    const SUPABASE_URL = '__SUPABASE_URL_PLACEHOLDER__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY_PLACEHOLDER__';
        
    const { useState, useEffect } = React;
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function goToTop(event) {
        event.preventDefault();
        document.getElementById('pagetop').scrollIntoView({ behavior: 'smooth' });
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    function hexToRgba(hex, alpha) {
        let cleanHex = hex.replace('#', '');
        if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(c => c + c).join('');
        }
        const num = parseInt(cleanHex, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function formatLapTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function formatSectorTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const seconds = Math.floor(ms / 1000);
      const millis = ms % 1000;
      return `${seconds}.${millis.toString().padStart(3, '0')}`;
    }

    function formatDelta(currentMs, p1Ms) {
      if (!currentMs || !p1Ms || currentMs === p1Ms) return '——';
      const diff = currentMs - p1Ms;
      const seconds = (diff / 1000).toFixed(3);
      return `+${seconds}s`;
    }

    function WeatherBadge({ wetlap }) {
      const isWet = String(wetlap).toLowerCase() === 'wet' || wetlap === true;
      return (
        <span title={isWet ? 'Wet Session' : 'Dry Session'} style={{ marginRight: '6px', fontSize: '15px', verticalAlign: 'middle' }}>
          {isWet ? '🌧️' : '☀️'}
        </span>
      );
    }

    function SectorSplitsDisplay({ splits, align = 'left' }) {
      if (!splits || !Array.isArray(splits) || splits.length === 0) return null;
      return (
        <div style={{ display: 'flex', justifyContent: align === 'right' ? 'flex-end' : 'flex-start', gap: '5px', flexWrap: 'wrap', marginTop: '4px' }}>
          {splits.map((splitMs, idx) => (
            <span key={idx} style={{ backgroundColor: '#111319', border: '1px solid rgba(255, 255, 255, 0.08)', color: '#cbd5e1', fontSize: '10px', fontFamily: 'monospace', padding: '1px 5px', borderRadius: '4px' }}>
              <span style={{ color: '#94a3b8', fontSize: '9px', marginRight: '3px' }}>S{idx + 1}</span>
              {formatSectorTime(splitMs)}
            </span>
          ))}
        </div>
      );
    }
    
    function parseSessionId(sessionId) {
      if (!sessionId) return { infoStr: '', type: '' };
      
      const parts = sessionId.split('_');
      if (parts.length < 3) return { infoStr: '', type: '' };

      const [datePart, timePart, remaining] = parts;
      
      const day = datePart.substring(4, 6);
      const month = datePart.substring(2, 4);
      const year = `20${datePart.substring(0, 2)}`;
      const formattedDate = `${day}/${month}/${year}`;

      const hours = timePart.substring(0, 2);
      const minutes = timePart.substring(2, 4);
      const formattedTime = `${hours}:${minutes}`;

      const typeLetter = remaining.split('-')[0];
      let sessionType = typeLetter;

      if (/^Q\d*$/.test(typeLetter)) {
        sessionType = 'Q';
      } else if (/^R\d*$/.test(typeLetter)) {
        sessionType = 'R';
      } else if (/^FP\d*$/.test(typeLetter)) {
        sessionType = 'Q';
      }

      return {
        infoStr: `${formattedDate} @ ${formattedTime}`,
        type: sessionType
      };
    }

    };

    const CLASS_COLORS = {
      'GT3': { bg: 'rgba(239, 68, 68, 0.1)', border: '#ef4444', text: '#fca5a5' },
      'GT4': { bg: 'rgba(59, 130, 246, 0.1)', border: '#3b82f6', text: '#93c5fd' },
      'GT2': { bg: 'rgba(16, 185, 129, 0.1)', border: '#10b981', text: '#6ee7b7' },
      'CUP': { bg: 'rgba(245, 158, 11, 0.1)', border: '#f59e0b', text: '#fde047' },
      'ST': { bg: 'rgba(139, 92, 246, 0.1)', border: '#8b5cf6', text: '#c4b5fd' },
      'CH': { bg: 'rgba(236, 72, 153, 0.1)', border: '#ec4899', text: '#fbcfe8' },
      'TC': { bg: 'rgba(107, 114, 128, 0.1)', border: '#6b7280', text: '#d1d5db' }
    };

    function ClassBadge({ carModel }) {
      const cls = CAR_CLASSES[String(carModel)] || 'OTHERS'; 
      const colors = CLASS_COLORS[cls] || { bg: 'rgba(17, 24, 39, 0.5)', border: '#374151', text: '#9ca3af' };
      return (
        <span style={{ display: 'inline-block', padding: '2px 6px', fontSize: '10px', fontWeight: 'bold', fontFamily: 'monospace', backgroundColor: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, borderRadius: '3px', marginRight: '8px', textTransform: 'uppercase', verticalAlign: 'middle' }}>
          {cls}
        </span>
      );
    }

    const CAR_MODELS = {
      '0': 'Porsche 991 GT3 R', '1': 'Mercedes-AMG GT3 (2015)', '2': 'Ferrari 488 GT3', '3': 'Audi R8 LMS', '4': 'Lamborghini Huracán GT3',
      '5': 'McLaren 650S GT3', '6': 'Nissan GT-R NISMO GT3 (2018)', '7': 'BMW M6 GT3', '8': 'Bentley Continental GT3 (2018)', '9': 'Porsche 991 II GT3 Cup',
      '10': 'Nissan GT-R NISMO GT3 (2017)', '11': 'Bentley Continental GT3 (2016)', '12': 'Aston Martin V12 Vantage GT3', '13': 'Lamborghini Gallardo R-EX',
      '14': 'Jaguar G3', '15': 'Lexus RC F GT3', '16': 'Lamborghini Huracán GT3 Evo', '17': 'Honda NSX GT3', '18': 'Lamborghini Huracán Super Trofeo',
      '19': 'Audi R8 LMS Evo', '20': 'Aston Martin V8 Vantage GT3', '21': 'Honda NSX GT3 Evo', '22': 'McLaren 720S GT3', '23': 'Porsche 991.2 GT3 R',
      '24': 'Ferrari 488 GT3 Evo', '25': 'Mercedes-AMG GT3 Evo', '26': 'Ferrari 488 Challenge Evo', '27': 'BMW M2 CS Racing', '28': 'Porsche 992 GT3 Cup',
      '29': 'Lamborghini Huracán Super Trofeo EVO2', '30': 'BMW M4 GT3', '31': 'Audi R8 LMS Evo II', '32': 'Ferrari 296 GT3', '33': 'Lamborghini Huracán GT3 EVO2',
      '34': 'Porsche 992 GT3 R', '35': 'McLaren 720S GT3 Evo', '36': 'Ford Mustang GT3', '50': 'Alpine A110 GT4', '51': 'Aston Martin Vantage GT4',
      '52': 'Audi R8 LMS GT4', '53': 'BMW M4 GT4', '55': 'Chevrolet Camaro GT4.R', '56': 'Ginetta G55 GT4', '57': 'KTM X-Bow GT4', '58': 'Maserati MC GT4',
      '59': 'McLaren 570S GT4', '60': 'Mercedes-AMG GT4', '61': 'Porsche 718 Cayman GT4 Clubsport', '80': 'Audi R8 LMS GT2', '82': 'KTM X-Bow GT2',
      '83': 'Maserati MC20 GT2', '84': 'Mercedes-AMG GT2', '85': 'Porsche 911 GT2 RS Clubsport Evo', '86': 'Porsche 935'
    };

    function App() {
      const [uniqueTracks, setUniqueTracks] = useState([]);
      const [queryData, setQueryData] = useState([]);
      const [selectedTrack, setSelectedTrack] = useState(''); 
      const [selectedClass, setSelectedClass] = useState('ALL'); 
      const [selectedWeather, setSelectedWeather] = useState('DRY'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [currentPage, setCurrentPage] = useState(1); 
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeDriverModal, setActiveDriverModal] = useState(null);

      const ITEMS_PER_PAGE = 25;
      
      // Load configuration on mount
      useEffect(() => {
        async function loadConfig() {
          try {
            const { data, error } = await supabase
                .from('clmconfig')
                .select('*')
                .limit(1)
                .single();

            if (error) {
                console.warn('No configuration found in clmconfig table:', error.message);
                return;
            }

            if (data) {
                if (data.usercolor) {
                    document.documentElement.style.setProperty('--accent-primary', data.usercolor);
                    document.documentElement.style.setProperty('--accent-glow', hexToRgba(data.usercolor, 0.15));
                }
            
                
                const nameEl = document.getElementById('commNameDisplay');
                const sloganEl = document.getElementById('commSloganDisplay');
                const stitleEl = document.getElementById('titleNameDisplay');
                const ltitleEl = document.getElementById('logoNameDisplay');
                const sttitleEl = document.getElementById('subtitleDisplay');
                const altlogoUrl = document.getElementById('logourlink');

                if (nameEl) nameEl.textContent = data.commname || 'Community Leaderboard';
                if (sloganEl) sloganEl.textContent = data.commslogan || 'Assetto Corsa Competizione - Community Leaderboard';
                if (stitleEl) stitleEl.textContent = data.pagetitle || 'Community Leaderboard';
                if (ltitleEl) ltitleEl.textContent = data.commname || 'Community Name';
                if (sttitleEl) sttitleEl.textContent = data.commsubtitle || 'CHAMPIONSHIP LEADERBOARDS';
                if (altlogoUrl) altlogoUrl.src = data.logourl || 'logo.png';

                const imageLogoContainer = document.getElementById('imageLogoContainer');
                const textLogoContainer = document.getElementById('textLogoContainer');

                if (data.uselogo === true) {
                    if (imageLogoContainer) imageLogoContainer.classList.remove('hidden');
                    if (textLogoContainer) textLogoContainer.classList.add('hidden');
                } else {
                    if (imageLogoContainer) imageLogoContainer.classList.add('hidden');
                    if (textLogoContainer) textLogoContainer.classList.remove('hidden');
                }
                
                const discordLink = document.getElementById('discordLink');
                const youtubeLink = document.getElementById('youtubeLink');
                const instagramLink = document.getElementById('instagramLink');
                const twitchLink = document.getElementById('twitchLink');
                             
                if (discordLink) discordLink.href = data.discord || 'discord.gg';
                if (youtubeLink) youtubeLink.href = data.youtube || 'youtube.com';
                if (instagramLink) instagramLink.href = data.instagram || 'instagram.com';
                if (twitchLink) twitchLink.href = data.twitch || 'twitch.tv';
                                
                if (data.discord != '') {if (discordLink) discordLink.classList.remove('hidden'); document.getElementById('soc-links').classList.remove('hidden');}
                if (data.youtube != '') {if (youtubeLink) youtubeLink.classList.remove('hidden'); document.getElementById('soc-links').classList.remove('hidden');}
                if (data.instagram != '') {if (instagramLink) instagramLink.classList.remove('hidden'); document.getElementById('soc-links').classList.remove('hidden');}
                if (data.twitch != '') {if (twitchLink) twitchLink.classList.remove('hidden'); document.getElementById('soc-links').classList.remove('hidden');}
                
            }
          } catch (err) {
              console.error('Error loading site configuration:', err);
          }
        }
        
        loadConfig();
      }, []);
   
      useEffect(() => { setCurrentPage(1); }, [selectedTrack, selectedClass, selectedWeather, searchQuery]);

      useEffect(() => {
        async function fetchTracksList() {
          try {
            const { data, error } = await supabase.rpc('get_unique_tracks');
            if (error) throw error;
            if (!data || data.length === 0) { setUniqueTracks([]); return; }
            const tracks = data.map(item => item.track ? String(item.track).trim().toLowerCase() : null).filter(Boolean);
            setUniqueTracks(tracks.sort());
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchTracksList();
      }, []);

      useEffect(() => {
        if (!selectedTrack) { setQueryData([]); return; }
        async function fetchFilteredLaps() {
          setLoading(true);
          try {
            let query = supabase.from('hotlaps').select('*').ilike('track', selectedTrack).order('best_lap_ms', { ascending: true }).range(0, 4999);
            if (selectedClass !== 'ALL') {
              const targetCarIds = Object.keys(CAR_CLASSES).filter(key => CAR_CLASSES[key] === selectedClass);
              query = query.in('car_model', [...targetCarIds, ...targetCarIds.map(id => Number(id))]);
            }
            if (selectedWeather === 'DRY') query = query.or('wetlap.ilike.dry,wetlap.eq.false');
            else if (selectedWeather === 'WET') query = query.or('wetlap.ilike.wet,wetlap.eq.true');

            const { data, error } = await query;
            if (error) throw error;
            setQueryData(data || []);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchFilteredLaps();
      }, [selectedTrack, selectedClass, selectedWeather]);

      if (loading && uniqueTracks.length === 0) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#0d0e12', color: '#94a3b8' }}><code>🏁 LOADING TELEMETRY ENGINE...</code></div>;
      }
      if (error) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#0d0e12', color: '#fca5a5' }}><code>🏁 RACE CONTROL ERROR: {error}</code></div>;
      }

      const seenDrivers = new Set();
      const baselineUniqueLaps = queryData.filter(lap => {
        if (seenDrivers.has(lap.driver_name)) return false;
        seenDrivers.add(lap.driver_name);
        return true;
      });

      const lapsWithDisplayPosition = baselineUniqueLaps.map((lap, index) => ({ ...lap, displayPosition: index + 1 }));
      const finalFilteredLaps = lapsWithDisplayPosition.filter(lap => lap.driver_name?.toLowerCase().includes(searchQuery.toLowerCase()));
      const p1Time = baselineUniqueLaps[0]?.best_lap_ms;
      const totalPages = Math.ceil(finalFilteredLaps.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedLaps = finalFilteredLaps.slice(startIndex, startIndex + ITEMS_PER_PAGE);
     

      const getDriverStats = (driverName) => {
        if (!driverName) return null;
        const driverLaps = queryData.filter(l => l.driver_name === driverName);
        const bestLap = driverLaps[0];
        const carsDriven = Array.from(new Set(driverLaps.map(l => CAR_MODELS[l.car_model] || `Car ID: ${l.car_model}`)));
        const position = baselineUniqueLaps.findIndex(l => l.driver_name === driverName) + 1;
        return {
          name: driverName, bestLapMs: bestLap?.best_lap_ms, bestSplits: bestLap?.best_splits,
          totalSessions: driverLaps.length, carsDriven, position: position > 0 ? position : 'N/A',
          delta: formatDelta(bestLap?.best_lap_ms, p1Time), wetlap: bestLap?.wetlap
        };
      };
      const driverStats = activeDriverModal ? getDriverStats(activeDriverModal) : null;

      return (
        <div style={{ minHeight: '100vh', color: '#f1f5f9', fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif', padding: '0px 0px 0px 0px' }}>
        <div style={{ maxWidth: '950px', margin: '0 auto' }}>
         
          
            <div style={{  display: 'flex', flexDirection: 'column', backgroundColor: '#16181f', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '10px', padding: '12px 20px 12px 20px', marginBottom: '30px', boxShadow: '0 8px 24px rgba(0, 0, 0, 0.5)', gap: '15px' }}>
            
              <div style={{ display: 'flex', alignItems: 'center', width: '100%' }}>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '7px', margin: '0px 0px 5px 0px'}}>
                    <span><a href="./" class="site-back-link">&#10094; &nbsp; Back To Championships</a></span>
                  </div>
                </div>
              </div>
              
              {selectedTrack !== '' && (
                <div style={{ display: 'flex', alignItems: 'flex-end', width: '100%', flexWrap: 'wrap', gap: '15px' }}>
                  <button onClick={() => setSelectedTrack('')} style={{ marginRight: 'auto', backgroundColor: '#1b1e28', color: '#cbd5e1', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px', padding: '7px 14px', fontFamily: 'system-ui, sans-serif', fontSize: '12px', fontWeight: '700', cursor: 'pointer' }}>
                    CHANGE TRACK
                  </button>
                  <div>
                    <label style={{ fontSize: '11px', color: '#94a3b8', display: 'block', fontWeight: '800', marginBottom: '4px', letterSpacing: '1px' }}>SEARCH DRIVER</label>
                    <input type="text" placeholder="ENTER DRIVER NAME..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ backgroundColor: '#0d0e12', color: '#fff', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', fontSize: '13px', width: '180px' }} />
                  </div>
                  <div>
                    <label style={{ fontSize: '11px', color: '#94a3b8', display: 'block', fontWeight: '800', marginBottom: '4px', letterSpacing: '1px' }}>SORT BY CLASS</label>
                    <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} style={{ backgroundColor: '#0d0e12', color: '#fff', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', fontSize: '13px', cursor: 'pointer' }}>
                      <option value="ALL">🏆 ALL CLASSES</option>
                      <option value="GT3">GT3</option><option value="GT4">GT4</option><option value="GT2">GT2</option><option value="CUP">CUP</option><option value="TC">TC</option><option value="CH">CH</option><option value="ST">ST</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: '11px', color: '#94a3b8', display: 'block', fontWeight: '800', marginBottom: '4px', letterSpacing: '1px' }}>WEATHER</label>
                    <select value={selectedWeather} onChange={(e) => setSelectedWeather(e.target.value)} style={{ backgroundColor: '#0d0e12', color: '#fff', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', fontSize: '13px', cursor: 'pointer' }}>
                      <option value="DRY">☀️ DRY LAPS</option>
                      <option value="WET">🌧️ WET LAPS</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: '11px', color: '#94a3b8', display: 'block', fontWeight: '800', marginBottom: '4px', letterSpacing: '1px' }}>SWITCH CIRCUIT</label>
                    <select value={selectedTrack} onChange={(e) => setSelectedTrack(e.target.value)} style={{ backgroundColor: '#0d0e12', color: '#fff', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', fontSize: '13px', cursor: 'pointer' }}>
                      {uniqueTracks.map(t => <option key={t} value={t}>📍 {TRACK_NAMES[t.toLowerCase()] || t.toUpperCase()}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>

            {selectedTrack === '' ? (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: '15px' }}>
                {uniqueTracks.map(trackKey => (
                  <button 
                    key={trackKey} 
                    onClick={() => setSelectedTrack(trackKey)} 
                    style={{ backgroundColor: '#16181f', border: '1px solid rgba(255, 255, 255, 0.08)', borderLeft: '4px solid #475569', borderRadius: '10px', padding: '18px 20px', textAlign: 'left', cursor: 'pointer', height: '100px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', transition: 'all 0.25s ease' }}
                    onMouseEnter={(e) => { e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.2)'; e.currentTarget.style.borderLeftColor = 'var(--accent-primary)'; e.currentTarget.style.backgroundColor = '#1f222b'; e.currentTarget.style.transform = 'translateX(4px)'; }}
                    onMouseLeave={(e) => { e.currentTarget.style.borderColor = 'rgba(255, 255, 255, 0.08)'; e.currentTarget.style.borderLeftColor = '#475569'; e.currentTarget.style.backgroundColor = '#16181f'; e.currentTarget.style.transform = 'translateX(0)'; }}
                  >
                    <span style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800', letterSpacing: '1.5px' }}>CIRCUIT</span>
                    <span style={{ fontSize: '17px', fontWeight: '900', color: '#ffffff', letterSpacing: '1px', textTransform: 'uppercase' }}>
                      {TRACK_NAMES[trackKey.toLowerCase()] || trackKey.toUpperCase()}
                    </span>
                  </button>
                ))}
              </div>
            ) : (
              <>
                {/* Dynamic Podium Grid */}
                {currentPage === 1 && searchQuery === '' && baselineUniqueLaps.length > 0 && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '20px', marginBottom: '30px' }}>
                    {baselineUniqueLaps.slice(0, 3).map((lap, i) => {
                      const positions = [
                        { badge: '#f59e0b', text: '🥇 P1 INTERVAL LEADER', bg: '#16181f', border: '#f59e0b', glow: 'rgba(245, 158, 11, 0.2)', timerColor: '#f59e0b' },
                        { badge: '#cbd5e1', text: '🥈 P2 PURSUING', bg: '#16181f', border: '#64748b', glow: 'rgba(0,0,0,0.3)', timerColor: '#ffffff' },
                        { badge: '#b45309', text: '🥉 P3 PURSUING', bg: '#16181f', border: '#78350f', glow: 'rgba(0,0,0,0.3)', timerColor: '#ffffff' }
                      ][i];
                      return (
                        <div key={`podium-${lap.id}`} style={{ backgroundColor: positions.bg, border: `1px solid ${positions.border}`, borderRadius: '10px', padding: '20px', position: 'relative', boxShadow: `0 6px 16px ${positions.glow}` }}>
                          <div style={{ color: positions.badge, fontSize: '11px', fontWeight: '800', marginBottom: '10px', letterSpacing: '0.1em' }}>{positions.text}</div>
                          <div onClick={() => setActiveDriverModal(lap.driver_name)} style={{ fontSize: '20px', fontWeight: '900', color: '#ffffff', textTransform: 'uppercase', cursor: 'pointer', transition: 'color 0.2s' }}
                            onMouseEnter={(e) => e.currentTarget.style.color = 'var(--accent-primary)'}
                            onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                          >
                            {lap.driver_name}
                          </div>
                          <div style={{ fontSize: '12px', color: '#94a3b8', margin: '6px 0 10px 0', display: 'flex', alignItems: 'center' }}>
                            <ClassBadge carModel={lap.car_model} />
                            {CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                          </div>
                          <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: '800', marginBottom: '10px', letterSpacing: '1px' }}>
                            TRACK: {TRACK_NAMES[lap.track?.toLowerCase()] || lap.track?.toUpperCase()}
                          </div>
                          <div style={{ marginBottom: '14px' }}>
                            <SectorSplitsDisplay splits={lap.best_splits} />
                          </div>
                          <div style={{ fontSize: '24px', fontWeight: '800', fontFamily: 'monospace', color: positions.timerColor, textAlign: 'right', backgroundColor: '#111319', padding: '6px 12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', display: 'flex', alignItems: 'center', justifyContent: 'flex-end' }}>
                            <WeatherBadge wetlap={lap.wetlap} />
                            {formatLapTime(lap.best_lap_ms)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div style={{ backgroundColor: '#16181f', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '10px', overflow: 'hidden', boxShadow: '0 10px 30px rgba(0, 0, 0, 0.4)' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#111319', borderBottom: '2px solid rgba(255, 255, 255, 0.08)', color: '#94a3b8', fontSize: '11px', letterSpacing: '2px' }}>
                        <th style={{ padding: '16px 20px', width: '70px', fontWeight: '800' }}>POS</th>
                        <th style={{ padding: '16px 20px', fontWeight: '800' }}>DRIVER</th>
                        <th style={{ padding: '16px 20px', fontWeight: '800' }}>CAR MODEL</th>
                        <th style={{ padding: '16px 20px', textAlign: 'right', fontWeight: '800' }}>DELTA</th>
                        <th style={{ padding: '16px 20px', textAlign: 'right', fontWeight: '800' }}>BEST LAP TIME</th>
                      </tr>
                    </thead>
                    <tbody>
                      {paginatedLaps.map((lap, index) => {
                        const absoluteIndex = startIndex + index;
                        const isActualFirst = lap.displayPosition === 1;
                        const {infoStr} = parseSessionId(lap.session_id);
                        return (
                          <tr key={lap.id} style={{ borderBottom: '1px solid rgba(255, 255, 255, 0.08)', backgroundColor: absoluteIndex % 2 === 0 ? '#16181f' : '#12141a' }}>
                            <td style={{ padding: '16px 20px', verticalAlign: 'top' }}>
                              <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '32px', height: '32px', borderRadius: '8px', fontWeight: '900', fontSize: '0.9rem', backgroundColor: isActualFirst ? '#f59e0b' : '#20232d', color: isActualFirst ? '#000' : '#94a3b8', border: isActualFirst ? 'none' : '1px solid rgba(255, 255, 255, 0.08)' }}>
                                {lap.displayPosition}
                              </span>
                            </td>
                            <td style={{ padding: '16px 20px', verticalAlign: 'top' }}>
                              <span onClick={() => setActiveDriverModal(lap.driver_name)} style={{ color: '#ffffff', fontWeight: '800', fontSize: '15px', cursor: 'pointer', transition: 'color 0.2s' }}
                                onMouseEnter={(e) => e.currentTarget.style.color = 'var(--accent-primary)'}
                                onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                              >
                                {lap.driver_name}
                              </span>
                              <div style={{ 
                                  fontSize: '11px', 
                                  color: '#94a3b8', 
                                  fontFamily: 'monospace', 
                                  marginTop: '2px'
                                }}>
                                  {infoStr}
                                </div>
                            </td>
                            <td style={{ padding: '16px 20px', color: '#cbd5e1', fontSize: '13px', verticalAlign: 'top' }}>
                              <ClassBadge carModel={lap.car_model} />{CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                            </td>
                            <td style={{ padding: '16px 20px', textAlign: 'right', color: isActualFirst ? 'var(--accent-primary)' : '#94a3b8', fontFamily: 'monospace', fontWeight: '700', verticalAlign: 'top' }}>{formatDelta(lap.best_lap_ms, p1Time)}</td>
                            <td style={{ padding: '16px 20px', textAlign: 'right', fontFamily: 'monospace', fontSize: '15px', color: isActualFirst ? 'var(--accent-gold)' : '#ffffff', verticalAlign: 'top' }}>
                              <div><WeatherBadge wetlap={lap.wetlap} />{formatLapTime(lap.best_lap_ms)}</div>
                              <SectorSplitsDisplay splits={lap.best_splits} align="right" />
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {/* PAGINATION CONTROLS */}
                  {totalPages > 1 && (
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', backgroundColor: '#111319', borderTop: '1px solid rgba(255, 255, 255, 0.08)', fontSize: '12px', fontWeight: '700' }}>
                      <div style={{ color: '#94a3b8' }}>
                        SHOWING {startIndex + 1} - {Math.min(startIndex + ITEMS_PER_PAGE, finalFilteredLaps.length)} OF {finalFilteredLaps.length} DRIVERS
                      </div>
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button 
                          onClick={() => setCurrentPage(p => Math.max(p - 1, 1))} 
                          disabled={currentPage === 1}
                          style={{ backgroundColor: currentPage === 1 ? '#16181f' : '#1b1e28', color: currentPage === 1 ? '#475569' : '#cbd5e1', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', cursor: currentPage === 1 ? 'not-allowed' : 'pointer' }}
                        >
                          PREV
                        </button>
                        <span style={{ padding: '6px 10px', color: '#ffffff' }}>PAGE {currentPage} OF {totalPages}</span>
                        <button 
                          onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))} 
                          disabled={currentPage === totalPages}
                          style={{ backgroundColor: currentPage === totalPages ? '#16181f' : '#1b1e28', color: currentPage === totalPages ? '#475569' : '#cbd5e1', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '6px', padding: '6px 12px', cursor: currentPage === totalPages ? 'not-allowed' : 'pointer' }}
                        >
                          NEXT
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>

       {/* DRIVER PROFILE MODAL POPUP */}
      {driverStats && (
        <div style={{
          position: 'fixed',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          backgroundColor: 'rgba(13, 14, 18, 0.85)',
          backdropFilter: 'blur(4px)',
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          zIndex: 1000,
          padding: '20px'
        }}
        onClick={() => setActiveDriverModal(null)}
        >
          <div style={{
            backgroundColor: '#16181f',
            border: '1px solid rgba(255, 255, 255, 0.08)',
            borderTop: '4px solid var(--accent-primary)',
            borderRadius: '10px',
            padding: '28px',
            maxWidth: '480px',
            width: '100%',
            boxShadow: '0 10px 30px rgba(0,0,0,0.6)',
            position: 'relative'
          }}
          onClick={(e) => e.stopPropagation()}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '20px' }}>
              <div>
                <div style={{ fontSize: '11px', color: 'var(--accent-primary)', fontWeight: '800', letterSpacing: '0.15em' }}>
                  DRIVER TELEMETRY PROFILE
                </div>
                <h2 style={{ margin: '4px 0 0 0', fontSize: '24px', color: '#ffffff', fontWeight: '900', textTransform: 'uppercase' }}>
                  {driverStats.name}
                </h2>
              </div>
              <button
                onClick={() => setActiveDriverModal(null)}
                style={{
                  backgroundColor: 'transparent',
                  color: '#94a3b8',
                  border: 'none',
                  fontSize: '20px',
                  fontWeight: 'bold',
                  cursor: 'pointer',
                  lineHeight: '1'
                }}
              >
                ✕
              </button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '20px' }}>
              <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px' }}>
                <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800' }}>POSITION</div>
                <div style={{ fontSize: '20px', color: '#f59e0b', fontFamily: 'monospace', fontWeight: 'bold' }}>P{driverStats.position}</div>
              </div>
              <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px' }}>
                <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800' }}>BEST LAP</div>
                <div style={{ fontSize: '20px', color: '#ffffff', fontFamily: 'monospace', display: 'flex', alignItems: 'center' }}>
                  <WeatherBadge wetlap={driverStats.wetlap} />
                  {formatLapTime(driverStats.bestLapMs)}
                </div>
              </div>
              <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px' }}>
                <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800' }}>DELTA TO P1</div>
                <div style={{ fontSize: '20px', color: 'var(--accent-primary)', fontFamily: 'monospace' }}>{driverStats.delta}</div>
              </div>
              <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px' }}>
                <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800' }}>SESSIONS RECORDED</div>
                <div style={{ fontSize: '20px', color: '#ffffff', fontFamily: 'monospace' }}>{driverStats.totalSessions}</div>
              </div>
            </div>

            {/* Modal Best Sector Splits */}
            <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px', marginBottom: '12px' }}>
              <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800', marginBottom: '6px' }}>BEST SECTOR SPLITS</div>
              <SectorSplitsDisplay splits={driverStats.bestSplits} align="left" />
            </div>

            <div style={{ backgroundColor: '#111319', padding: '12px', border: '1px solid rgba(255, 255, 255, 0.08)', borderRadius: '8px', marginBottom: '20px' }}>
              <div style={{ fontSize: '10px', color: '#94a3b8', fontWeight: '800', marginBottom: '6px' }}>CARS DRIVEN</div>
              <div style={{ fontSize: '13px', color: '#cbd5e1', fontFamily: 'sans-serif' }}>
                {driverStats.carsDriven.join(', ')}
              </div>
            </div>

            <button
              onClick={() => setActiveDriverModal(null)}
              style={{
                width: '100%',
                backgroundColor: '#1b1e28',
                color: '#f1f5f9',
                border: '1px solid rgba(255, 255, 255, 0.08)',
                borderRadius: '8px',
                padding: '10px',
                fontSize: '12px',
                fontWeight: '800',
                cursor: 'pointer',
                letterSpacing: '0.1em',
                textTransform: 'uppercase'
              }}
            >
              CLOSE PROFILE
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <!-- Footer -->
<footer>
    <div class="footer-content">
    <a href="https://www.accracehost.com/accrsync.html" target="_new" class="footerlink">Live Hotlaps - Powered By ACCR-Sync</a>
    </div>
		<div class="footer-content">
    <a href="#pagetop" onclick="goToTop(event)" class="back-btn">&#8593; Back to Top</a>
    </div>
</footer>
</body>
</html>
